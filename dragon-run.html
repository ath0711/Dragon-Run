<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a1c;--card:#16282b;--line:#264247;--text:#eef4f2;--muted:#93aba7;--gold:#f2b84b;--gold2:#ffd77a;--red:#e05a47;--green:#3fae78;--parch:#f3e6c4;--parch2:#e6d09c;--ink:#3b2a14;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,#1f3a3c 0%,var(--bg) 65%) fixed}
#app{max-width:720px;margin:0 auto;padding:14px 16px 40px}
.title{font-family:Cinzel,serif;font-weight:900;letter-spacing:.5px}
.no-select{user-select:none;-webkit-user-select:none}
h1,h2,h3{margin:.2em 0 .45em}
a{color:var(--gold)}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 18px;font:700 16px Inter,sans-serif;cursor:pointer;background:var(--gold);color:#2a1b02;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid #35585d}
.btn.red{background:var(--red);color:#fff}.btn.green{background:var(--green);color:#fff}
.btn.block{display:block;width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}
.card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--line)}
.parch{background:var(--parch);color:var(--ink);border-radius:10px;padding:18px 16px;box-shadow:0 8px 24px rgba(0,0,0,.35);position:relative}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.logo{font-family:Cinzel,serif;font-weight:900;font-size:38px;color:var(--gold);text-align:center;margin:22px 0 2px;text-shadow:0 3px 0 #6b3d00}
.sub{text-align:center;color:var(--muted);margin-bottom:20px}
.hero{font-size:64px;text-align:center;line-height:1}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px;color:var(--muted)}
select,input{width:100%;padding:13px 12px;border-radius:10px;border:1.5px solid #2f5156;background:#0d1719;color:var(--text);font:16px Inter,sans-serif}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pill{background:#0d1719;border:1px solid #2c4a4f;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.pill.gold{color:var(--gold)}.pill.red{color:#ff8f80;border-color:#6a2c25}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--gold)}
/* ---------- map ---------- */
.map{background:var(--parch);border-radius:16px;padding:18px 14px;margin:16px 0;box-shadow:inset 0 0 60px rgba(120,80,20,.35),0 8px 24px rgba(0,0,0,.35);color:var(--ink);position:relative}
.map h3{font-family:Cinzel,serif;text-align:center;margin:0 0 6px}
.node{display:flex;align-items:center;gap:12px;width:86%;background:#fff8e6;border:2px solid var(--parch2);border-radius:14px;padding:10px 12px;cursor:pointer;position:relative;text-align:left;font-family:Inter,sans-serif;color:var(--ink);margin-bottom:26px}
.node:nth-of-type(even){margin-left:14%}
.node::after{content:"";position:absolute;bottom:-26px;height:26px;border-left:3px dashed #b0884a}
.node:nth-of-type(odd)::after{left:70%}.node:nth-of-type(even)::after{left:30%}
.node:last-of-type{margin-bottom:0}.node:last-of-type::after{display:none}
.node .ic{font-size:34px;width:46px;text-align:center;flex:none}
.node b{font-family:Cinzel,serif;font-size:15px;display:block}
.node .tp{font-size:12px;color:#7a6440}
.node .st{color:#c08a14;letter-spacing:2px;font-size:15px}
.node.locked{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.node.cur{border-color:var(--gold);box-shadow:0 0 0 3px #f2b84b66}
.node .badge{position:absolute;right:8px;top:-10px;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
/* ---------- scene ---------- */
.scene{position:relative;height:190px;border-radius:16px;overflow:hidden;margin-bottom:12px;border:1px solid #00000055;background:linear-gradient(var(--s1),var(--s2))}
.scene .deco{position:absolute;left:0;bottom:46px;white-space:nowrap;font-size:34px;transition:transform .9s ease-out;opacity:.9}
.scene .deco.far{bottom:70px;font-size:22px;opacity:.55}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:50px;background:var(--gr);border-top:3px solid #00000033}
.scene .ground::before{content:"";position:absolute;left:0;right:0;top:20px;border-top:3px dashed #ffffff55}
.actor{position:absolute;bottom:34px;transition:left .6s ease-out;line-height:1}
.runner{font-size:42px;left:60%}
.runner span,.dragon span{display:inline-block;transform:scaleX(-1)}
.runner span{animation:bob .45s infinite alternate}
.dragon{font-size:66px;bottom:38px}
.dragon span{animation:flap .6s infinite alternate}
.fire{position:absolute;font-size:30px;bottom:56px;opacity:0;transition:opacity .2s, left .6s}
.scene.breath .fire{opacity:1;animation:flick .2s infinite alternate}
.treasure{font-size:40px;bottom:36px;transition:left .8s ease-out}
.scene .tag{position:absolute;top:8px;background:#000a;color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.scene .tag.l{left:8px}.scene .tag.r{right:8px}
.scene.danger{animation:danger .8s infinite}
.scene.hit .runner span{animation:hit .4s}
@keyframes bob{to{transform:scaleX(-1) translateY(-6px)}}
@keyframes flap{to{transform:scaleX(-1) translateY(-8px) scale(1.05)}}
@keyframes flick{to{transform:scale(1.25)}}
@keyframes hit{50%{transform:scaleX(-1) rotate(20deg)}}
@keyframes danger{50%{box-shadow:inset 0 0 50px #ff2a00}}
.gap{height:10px;border-radius:5px;background:#2a3b3e;overflow:hidden;margin:2px 0 12px}
.gap i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--green));transition:width .25s}
.hud{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.progress{display:flex;gap:4px;margin-bottom:12px}
.progress span{flex:1;height:6px;border-radius:3px;background:#2a3b3e}
.progress span.ok{background:var(--green)}.progress span.bad{background:var(--red)}.progress span.cur{background:var(--gold)}
/* ---------- full-screen run ---------- */
body.running{overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden;z-index:5;touch-action:manipulation}
.world{position:absolute;left:0;top:0;will-change:transform}
.world svg{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;z-index:2}
.tok .in{position:absolute;left:0;top:0;line-height:1;transform:translate(-50%,-85%) scaleX(var(--fx,1))}
.runner{z-index:3}
.runner .in{font-size:42px;animation:bob2 .3s infinite alternate}
.dragon .in{font-size:72px;animation:flap2 .45s infinite alternate;filter:drop-shadow(0 8px 5px rgba(0,0,0,.35))}
@keyframes bob2{to{transform:translate(-50%,-100%) scaleX(var(--fx,1))}}
@keyframes flap2{to{transform:translate(-50%,-95%) scaleX(var(--fx,1)) scale(1.07)}}
.runner.shake .in{animation:shake .1s 5 linear}
@keyframes shake{0%{transform:translate(-58%,-85%) scaleX(var(--fx,1))}50%{transform:translate(-42%,-90%) scaleX(var(--fx,1))}100%{transform:translate(-50%,-85%) scaleX(var(--fx,1))}}
.bubble{position:absolute;left:10px;top:-96px;font-size:28px;line-height:1;opacity:0;background:#fff;border-radius:50%;padding:5px;box-shadow:0 3px 8px #0006}
.bubble.pop{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9) translateY(-10px)}}
.flame{position:absolute;left:0;top:0;font-size:28px;line-height:1;pointer-events:none;z-index:4}
.roar{position:absolute;left:0;top:0;font:900 22px Cinzel,serif;color:#ffdd8a;text-shadow:0 2px 0 #7a1d00,0 0 10px #ff5a00;pointer-events:none;z-index:4;white-space:nowrap}
.dangerv{position:absolute;inset:0;pointer-events:none;z-index:3;transition:box-shadow .25s}
.stage.close .dangerv{animation:danger2 .8s infinite}
@keyframes danger2{50%{box-shadow:inset 0 0 80px 14px #ff2a00aa}}
.stage.heat .dangerv{box-shadow:inset 0 0 130px 40px #ff7a00cc;animation:none}
.hud2{position:absolute;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 12px 18px;background:linear-gradient(#000b,#0000);z-index:5}
.hud2 .r1{display:flex;gap:6px;justify-content:space-between;align-items:center}
.hud2 .land{max-width:42%;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:8px;margin-top:8px;color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 2px #000}
.meter .gap{flex:1;margin:0;box-shadow:0 0 0 1px #0006}
.dtag{position:absolute;z-index:5;background:#000c;color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;transform:translate(-50%,-100%);display:none;white-space:nowrap}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,720px);max-height:56%;overflow-y:auto;background:var(--parch);color:var(--ink);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.45);z-index:6;-webkit-overflow-scrolling:touch}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#c7a96a;margin:0 auto 10px}
.sheet .feedback{color:#eef4f2}
.sheet .btn.ghost{color:var(--ink);border-color:#c7a96a}
.sheet .muted{color:#7a6440}
.sheet .stmt{background:#fffaf0;box-shadow:inset 0 0 0 2px #dcc796}
.sheet .bar{background:#e6d6ad}
@media (max-width:420px){.hud2 .land{display:none}}
/* ---------- class race ---------- */
.ghost{z-index:1;opacity:.75}
.ghost .in{font-size:30px;filter:saturate(.6)}
.ghost .nm{position:absolute;left:0;top:4px;transform:translateX(-50%);background:#000a;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap}
.big2{font-size:16px}
.rtop{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rtop span{background:#000a;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.rtop span.me{background:var(--gold);color:#2a1b02}
.cd{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;font:900 90px Cinzel,serif;color:#ffd77a;text-shadow:0 6px 0 #6b3d00,0 0 30px #000;background:#0006;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{background:#fff8e6;color:var(--ink);border:1.5px solid #dcc796;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.chip.me{background:var(--gold)}
.hboard{padding:8px 4px}
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.htime{font:900 40px Cinzel,serif;color:var(--gold)}
.lanes{--lx:240px;position:relative;background:linear-gradient(90deg,#1c3033 0,#1c3033 var(--lx),#2c4a2a var(--lx),#3c5a2a 100%);border-radius:14px;overflow:hidden;border:2px solid #35585d}
.lane{position:absolute;left:0;right:0;display:flex;align-items:center;transition:top .8s ease;border-bottom:1px dashed #ffffff22}
.lane .rk{width:46px;text-align:center;font-weight:800;font-size:20px}
.lane .nm{width:calc(var(--lx) - 46px);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.lane .rn{position:absolute;top:50%;font-size:26px;transform:translate(-50%,-50%) scaleX(-1);transition:left 2s linear}
.lane .ds{position:absolute;right:8px;font-weight:800;color:#ffd77a;font-size:16px}
.dline{position:absolute;top:0;bottom:0;width:4px;background:linear-gradient(#ff5a00,#ff2a00);box-shadow:0 0 18px 6px #ff5a0088;transition:left 2s linear;z-index:2}
.dline span{position:absolute;top:-2px;left:50%;transform:translateX(-50%) scaleX(-1);font-size:40px}
.fline{position:absolute;top:0;bottom:0;right:60px;border-left:4px dashed #fff;font-size:26px;padding-left:4px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin-top:20px}
.pod{text-align:center;width:200px}.pod b{display:block;font-size:20px}.pm{font-size:56px}
.pod div[class^=bar]{margin-top:8px;border-radius:12px 12px 0 0;font:900 40px Cinzel,serif;color:#2a1b02;background:var(--gold);display:flex;align-items:center;justify-content:center}
.bar1{height:160px}.bar2{height:110px;background:#d8d8d8!important}.bar3{height:80px;background:#d79a5b!important}
/* ---------- questions ---------- */
.qtype{font-size:12px;font-weight:800;color:#8a6a33;text-transform:uppercase;letter-spacing:1px}
.ctx{background:#fff3cf;border-left:4px solid var(--gold);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:15px}
.qtext{font-size:20px;line-height:1.45;margin:8px 0 14px;font-weight:600}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink)}
.opts{display:grid;gap:10px}
.opt{background:#fffaf0;border:2px solid #dcc796;border-radius:10px;padding:14px;font:600 17px Inter,sans-serif;color:var(--ink);text-align:left;cursor:pointer}
.opt.right{background:#d6f3e3;border-color:var(--green)}.opt.wrong{background:#fbdcd8;border-color:var(--red)}
.slot{min-height:60px;border:2px dashed #c7a96a;border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:12px;background:#fffaf0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{background:#efe2bf;border:2px solid #b99a5b;border-bottom-width:4px;border-radius:9px;padding:9px 12px;font:600 16px Inter,sans-serif;color:var(--ink);cursor:pointer}
.slot .tile{background:#fff}
.tile.used{visibility:hidden}
.sentence{display:flex;flex-wrap:wrap;gap:6px;line-height:1.6}
.word{background:transparent;border:0;border-bottom:2px dotted #b99a5b;padding:4px;font:600 19px Inter,sans-serif;color:var(--ink);cursor:pointer;border-radius:4px}
.word.right{background:#d6f3e3}.word.wrong{background:#fbdcd8}
.feedback{margin-top:12px;border-radius:12px;padding:14px;font-size:16px;line-height:1.5}
.feedback.ok{background:#143326;border:1px solid var(--green)}.feedback.no{background:#3a1c18;border:1px solid var(--red)}
.hintbox{margin-top:12px;background:#fff3c9;color:var(--ink);border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:15px}
.stmt{background:var(--parch);color:var(--ink);border-radius:10px;padding:20px 16px;font-size:20px;font-weight:600;line-height:1.45;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center}
.bar{height:8px;background:#2a3b3e;border-radius:4px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--red);width:100%}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.judge .btn{padding:20px 10px;font-size:19px}
.flash{min-height:26px;margin-top:10px;font-weight:700}
#overlay{position:fixed;inset:0;background:rgba(6,12,13,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#overlay.hidden{display:none}
#overlay .box{max-width:420px;text-align:center}
.big{font-size:60px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;max-width:90vw}
#toast.show{opacity:1}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #22393c}
th{color:var(--muted);font-size:13px;font-weight:600}
tr.me td{background:#33290f;color:var(--gold)}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bag .it{background:var(--parch);color:var(--ink);border-radius:12px;padding:14px;text-align:center}
.bag .it .e{font-size:40px}.bag .it.no{filter:grayscale(1);opacity:.4}
.board-mode #app{max-width:1100px}
.board-mode td,.board-mode th{font-size:24px;padding:14px}
.foot{text-align:center;color:#4f6b67;font-size:12px;margin-top:30px}
.spinner{width:34px;height:34px;border:4px solid #2c4a4f;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:480px){.qtext{font-size:18px}.logo{font-size:30px}.stmt{font-size:18px}.word{font-size:17px}th,td{padding:8px 5px;font-size:14px}.scene{height:170px}.dragon{font-size:56px}}
</style>
</head>

<div id="app"></div>
<div id="overlay" class="hidden"><div class="box" id="overlayBox"></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   SETTINGS — edit these
   ===================================================================== */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzYJbflZvYwHk5MSUUv-TzxdW7ualqDdEeGI7NTRMDZHC3x_5uMEZmxE7W1GHfMaa9qmA/exec",               // ← paste your Google Apps Script Web App URL here. Empty = demo mode.
  MAX_ATTEMPTS: 3,           // attempts per land (best attempt counts) — keep the same in Code.gs
  MAX_STRIKES: 3,            // strike 3 = level auto-submitted
  STRIKE_PENALTY: 100,       // points lost on strike 2
  HINT_COST: 30,             // points per hint
  START_GAP: 40,             // metres between you and the dragon at the start
  LEADERBOARD_REFRESH_MS: 15000,
  RACE_TRACK: 500,           // class race: length of the track in metres
  RACE_POLL_MS: 3000,        // class race: how often each phone sends its position (ms)
  CREDIT: "Fatma Sari, S.Pd., M.Pd."
};

/* =====================================================================
   WORD BANKS for the question generators
   Add more rows to any list to get even more different questions.
   ===================================================================== */
// PASSIVE — verb forms [V1, V2, V3, V-s, V-ing]; objects/agents [phrase, plural?]; inst = no continuous tenses
const ACTIONS = [
  {v:["clean","cleaned","cleaned","cleans","cleaning"], o:[["the classroom",0],["the windows",1],["the dormitory",0]], a:[["the students",1],["the janitor",0]]},
  {v:["write","wrote","written","writes","writing"], o:[["the report",0],["the letters",1],["the school news",0]], a:[["the secretary",0],["the journalists",1]]},
  {v:["build","built","built","builds","building"], o:[["the new houses",1],["the mosque",0],["the fence",0]], a:[["the workers",1],["a local company",0]]},
  {v:["repair","repaired","repaired","repairs","repairing"], o:[["the old computer",0],["the broken chairs",1],["the roof",0]], a:[["the technician",0],["the students",1]]},
  {v:["steal","stole","stolen","steals","stealing"], o:[["the money",0],["the bicycles",1],["the painting",0]], a:[["a thief",0],["two men",1]], inst:1},
  {v:["make","made","made","makes","making"], o:[["the cake",0],["these bags",1],["the decorations",1]], a:[["my mother",0],["local women",1]]},
  {v:["send","sent","sent","sends","sending"], o:[["the invitation",0],["the packages",1],["the results",1]], a:[["the committee",0],["the office",0]]},
  {v:["choose","chose","chosen","chooses","choosing"], o:[["the winner",0],["the new captain",0],["the best essays",1]], a:[["the judges",1],["the principal",0]], inst:1},
  {v:["wash","washed","washed","washes","washing"], o:[["the dishes",1],["the car",0],["the uniforms",1]], a:[["the cook",0],["the boys",1]]},
  {v:["give","gave","given","gives","giving"], o:[["the prizes",1],["the certificate",0]], a:[["the headmaster",0],["the guests",1]]},
  {v:["break","broke","broken","breaks","breaking"], o:[["the window",0],["the glasses",1],["the vase",0]], a:[["the cat",0],["the children",1]], inst:1},
  {v:["check","checked","checked","checks","checking"], o:[["the homework",0],["the answers",1],["the tickets",1]], a:[["the teacher",0],["the officers",1]]},
  {v:["plant","planted","planted","plants","planting"], o:[["the trees",1],["a mango tree",0],["the flowers",1]], a:[["the farmers",1],["the scouts",1]]},

const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const uniq = a => [...new Set(a)];
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const joinS = (...p) => p.filter(x => x!==undefined && x!==null && String(x).trim()!=="").join(" ").replace(/\s+([,.!?])/g,"$1");

function gPassive(frames){
  return () => {
    const ai=rnd(ACTIONS.length), A=ACTIONS[ai];
    const fr = pick(frames.filter(k => !(A.inst && ["ps","pc","pastc","fut","modal"].includes(k)))), F=PF[fr];
    const oi=rnd(A.o.length), gi=rnd(A.a.length), ti=rnd(F.time.length);
    const [obj,p]=A.o[oi], [ag,ap]=A.a[gi], time=F.time[ti];
    const m = pick(["must","should"]);
    const ans = F.pas(A.v,p,m).join(" ");
    const wrongs = uniq(F.bad(A.v,p,m).map(x=>x.join(" "))).filter(x=>x!==ans);
    const active = joinS(cap(ag), F.act(A.v,ap,m).join(" "), obj, time)+".";
    const alt = [joinS(cap(obj), ans, time)];
    if (time) alt.push(joinS(time, obj, ans, "by", ag));
    return {key:`pv.${fr}.${ai}.${oi}.${gi}.${ti}`, pre:cap(obj), ans, wrongs, post:joinS("by", ag, time)+".", h:F.h,
            build:{q:`Make it passive: “${active}”`, alt}};
  };
}
const COND_HINT = {1:"Type 1 (real future): If + present simple, will + V1. Never WILL after IF.",
                   2:"Type 2 (unreal now): If + past simple, would + V1.",
                   3:"Type 3 (unreal past): If + had + V3, would have + V3."};
function gCond(types){
  return () => {
    const ci=rnd(COND.length), C=COND[ci], t=pick(types), slot=pick(["if","res"]);
    const [is,i3,iv,ir]=C.i, [rs,r3,rv,rr]=C.r;
    const ifv = t===1 ? (i3?iv[3]:iv[0]) : t===2 ? iv[1] : "had "+iv[2];
    const res = t===1 ? "will "+rv[0] : t===2 ? "would "+rv[0] : "would have "+rv[2];
    let wr;
    if (slot==="if") wr = t===1 ? ["will "+iv[0],"would "+iv[0],"had "+iv[2]]
                       : t===2 ? ["will "+iv[0],"would "+iv[0], i3?iv[3]:iv[0]]
                       : ["would have "+iv[2],"have "+iv[2],"had "+iv[0],"has "+iv[2]];
    else wr = t===1 ? ["would "+rv[0],"would have "+rv[2],"will "+rv[1],"will to "+rv[0]]
            : t===2 ? ["will "+rv[0],"would "+rv[1],"would to "+rv[0],"would "+rv[3]]
            : ["will have "+rv[2],"would had "+rv[2],"would have "+rv[0],"would has "+rv[2]];
    const ans = slot==="if" ? ifv : res;
    wr = uniq(wr).filter(x=>x!==ans);
    const pre  = slot==="if" ? joinS("If", is) : joinS("If", is, ifv, ir)+", "+rs;
    const post = slot==="if" ? joinS(ir+",", rs, res, rr)+"." : rr+".";
    return {key:`cd.${t}.${slot}.${ci}`, pre, ans, wrongs:wr, post, h:COND_HINT[t],
            build:{q:`Type ${t} conditional: (${is} / ${iv[0]} ${ir} → ${rs} / ${rv[0]} ${rr})`, alt:[joinS(rs, res, rr, "if", is, ifv, ir)]}};
  };
}

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };

    for (const w of shuffle(sl.wrongs)) {

      let p=0; while (p<at.length && p<wt.length && at[p]===wt[p]) p++;
      let s=0; while (s<at.length-p && s<wt.length-p && at[at.length-1-s]===wt[wt.length-1-s]) s++;
      let ws=wt.slice(p,wt.length-s), cs=at.slice(p,at.length-s);

}
function buildSteps(L){
  if (L.story) return storySteps();
  const gens = L.mix ? LEVELS.filter(x=>!x.mix && !x.story).flatMap(x=>x.gens) : L.gens;
  const used = new Set();
  const make = kind => {
    for (let k=0;k<400;k++) {
      const sl = pick(gens)();
      if (used.has(sl.key)) continue;
      if (k<250 && S.seen.has(sl.key)) continue;      // prefer questions this student has never seen
      const it = toKind(sl, k<300 ? kind : "choose");
      if (!it) continue;
      used.add(sl.key); return it;
    }
    return toKind(pick(gens)(), "choose");
  };
  const kinds = shuffle(["choose","choose","build","build","spot","spot"]);
  const steps = PATTERN.map(x => x==="Q" ? make(kinds.shift()) : make("fire"));
  return {steps, qids:[...used]};
}

function computeProgress(rows){
  const p = {};
  rows.forEach(r => {
    const c = p[r.caseId] || (p[r.caseId] = {attempts:0, done:false, won:false, bestPoints:0, bestAcc:0, practice:0, practiceBest:0});
    if (Number(r.attempt) === 0) {                    // practice run: no try used, no grade
      if (r.status !== "started") { c.practice++; c.practiceBest = Math.max(c.practiceBest, Number(r.points)||0); if (r.status==="completed") c.won = true; }
      return;
    }
    c.attempts++;
    if (r.status === "completed") c.won = true;
    if (r.status !== "started") { c.done = true; c.bestPoints = Math.max(c.bestPoints, Number(r.points)||0); c.bestAcc = Math.max(c.bestAcc, r.total ? Math.round(r.correct/r.total*100) : 0); }
  });
  return p;
}
function leaderboardFrom(rows, cls){
  const m = {};
  rows.forEach(r => {
    if ((cls && r.cls!==cls) || r.status==="started") return;
    const k = r.cls+"|"+r.name, s = m[k] || (m[k] = {name:r.name, cls:r.cls, best:{}});
    s.best[r.caseId] = Math.max(s.best[r.caseId]||0, Number(r.points)||0);
  });
  return Object.values(m).map(s => ({name:s.name, cls:s.cls, points:Object.values(s.best).reduce((a,b)=>a+b,0), cases:Object.keys(s.best).length}))
    .sort((a,b) => b.points-a.points || b.cases-a.cases);
}

const Mock = {
  roster:[ {cls:"XI-1", name:"Demo Student A", pin:"1111"}, {cls:"XI-1", name:"Demo Student B", pin:"2222"}, {cls:"XI-2", name:"Demo Student C", pin:"3333"} ],
  db(){ return store.get("dr_demo_db") || memDB || {attempts:[]}; },
  save(d){ memDB=d; store.set("dr_demo_db", d); },
  auth(d){ return this.roster.find(s => s.cls===d.cls && s.name===d.name && s.pin===String(d.pin||"").trim()); },
  exec(action, d){
    if (action.startsWith("race")) return MockRace.exec(action, d);
    const db = this.db();
    if (action==="roster") return {ok:true, students:this.roster.map(s=>({cls:s.cls, name:s.name}))};
    if (action==="leaderboard") return {ok:true, rows:leaderboardFrom(db.attempts, d.cls).concat(SAMPLE_ROWS.filter(r=>!d.cls||r.cls===d.cls)).sort((a,b)=>b.points-a.points)};
    if (!this.auth(d)) return {ok:false, error:"Wrong name or PIN."};
    const mine = () => db.attempts.filter(r => r.cls===d.cls && r.name===d.name);
    if (action==="login") return {ok:true, progress:computeProgress(mine()), seen:mine().flatMap(r => (r.qids||"").split(",").filter(Boolean))};
    const caseId = Number(d.caseId);
    if (action==="start") {
      const prog = computeProgress(mine());
      if (caseId>1 && !(prog[caseId-1] && prog[caseId-1].done)) return {ok:false, error:"This land is still locked."};
      const used = mine().filter(r => r.caseId===caseId && r.attempt>0).length;
      const n = d.practice ? 0 : used+1;
      if (d.practice && used < CONFIG.MAX_ATTEMPTS) return {ok:false, error:"Use your graded tries first."};
      if (!d.practice && used >= CONFIG.MAX_ATTEMPTS) return {ok:false, error:"No tries left for this land."};
      db.attempts.push({cls:d.cls, name:d.name, caseId, attempt:n, status:"started", points:0, correct:0, total:0, speed:0, strikes:0});
      this.save(db); return {ok:true, attempt:n};
    }
    if (action==="submit") {
      const row = db.attempts.filter(r => r.cls===d.cls && r.name===d.name && r.caseId===caseId && r.attempt===Number(d.attempt) && r.status==="started").pop();
      if (!row) return {ok:false, error:"Attempt not found or already submitted."};
      Object.assign(row, {status:d.status, points:Number(d.points)||0, correct:Number(d.correct)||0, total:Number(d.total)||0, speed:Number(d.speed)||0, strikes:Number(d.strikes)||0, qids:d.qids||""});
      this.save(db); return {ok:true, progress:computeProgress(mine())};
    }
    return {ok:false, error:"Unknown action"};
  },
  async call(a,d){ await new Promise(r=>setTimeout(r,150)); return this.exec(a,d); }
};
async function api(action, data={}){
  if (!CONFIG.API_URL) return Mock.call(action, data);
  const res = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action, ...data})});
  if (!res.ok) throw new Error("Network error "+res.status);
  return res.json();
}

const MAPCOL = {1:["#b5dca0","#6fae5f"],2:["#f3d9a6","#cf9a5c"],3:["#bfe3d3","#6fae9a"],4:["#6b638f","#2f2a4a"],5:["#f2dca0","#c7955a"],
                6:["#dfe8ec","#94a7b0"],7:["#8a3424","#2a0e09"],8:["#8cbdd1","#3a6a80"],9:["#4a2b6b","#150a24"]};
const MW = 400, MH = 1600, U = 2.6;            // map units; U = map units per metre of dragon distance
const seeded = n => { let x = n*9301+49297; return () => (x = (x*9301+49297) % 233280) / 233280; };
const emojiList = s => { try { return [...new Intl.Segmenter().segment(s)].map(x=>x.segment).filter(x=>x.trim()); } catch(e) { return Array.from(s).filter(x=>x.trim() && x!=="️"); } };

function mapSVG(L){
  const R = seeded(L.id*7+3), col = MAPCOL[L.id] || ["#cde","#9ab"], N = 9, pts = [], samples = [];
  for (let k=0;k<=N;k++) pts.push([k===0 ? 200 : k%2 ? 90+R()*55 : 255+R()*55, MH-90 - k*(MH-190)/N]);
  const bz = (a,b,c,d,t) => { const u=1-t; return [u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0], u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]]; };
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=0;i<pts.length-1;i++) {
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
    for (let t=0;t<=1;t+=.1) samples.push(bz(p1,c1,c2,p2,t));
  }
  const deco = emojiList(L.deco), far = emojiList(L.far);
  let blobs = "", items = "";
  for (let k=0;k<26;k++) blobs += `<circle cx="${(R()*MW).toFixed(0)}" cy="${(R()*MH).toFixed(0)}" r="${(30+R()*60).toFixed(0)}" fill="${col[1]}" opacity=".22"/>`;
  for (let y=40;y<MH-20;y+=56) for (let x=24;x<MW;x+=58) {
    const px=x+(R()-.5)*30, py=y+(R()-.5)*30;
    if (samples.some(([sx,sy]) => Math.hypot(sx-px, sy-py) < 50)) continue;
    if (R() < .18) continue;
    const e = R() < .15 && far.length ? far[Math.floor(R()*far.length)] : deco[Math.floor(R()*deco.length)];
    items += `<text x="${px.toFixed(0)}" y="${py.toFixed(0)}" font-size="${(24+R()*16).toFixed(0)}" text-anchor="middle">${e}</text>`;
  }
  return `<svg viewBox="0 0 ${MW} ${MH}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col[1]}"/><stop offset="1" stop-color="${col[0]}"/></linearGradient>
      <radialGradient id="tg"><stop offset="0" stop-color="#ffe9a3"/><stop offset="1" stop-color="#ffe9a300"/></radialGradient></defs>
    <rect width="${MW}" height="${MH}" fill="url(#mg)"/>${blobs}
    <path d="${d}" stroke="#0000002e" stroke-width="32" fill="none" stroke-linecap="round"/>
    <path id="trail" d="${d}" stroke="#f4e3b5" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="${d}" stroke="#a07a3c" stroke-width="2" stroke-dasharray="6 9" fill="none"/>
    ${items}<g id="marks"></g></svg>`;
}
const P = s => { const r=S.run, p=r.trail.getPointAtLength(Math.max(0, Math.min(r.Ls, s))); return {x:p.x, y:p.y}; };
const stepS = k => S.run.Ls * (0.05 + 0.87*k/10);

function breathe(big){
  const r = S.run, world = $("#world"), stage = $("#stage"); if (!r || !world || !stage) return;
  const sc = stage.clientWidth/MW, rp = P(r.rS), dp = P(r.dS);
  const ax = dp.x*sc, ay = dp.y*sc - 30, bx = rp.x*sc, by = rp.y*sc - 20;
  let dx = bx-ax, dy = by-ay; const dist = Math.hypot(dx,dy) || 1; dx/=dist; dy/=dist;
  const reach = big ? dist+40 : Math.min(dist+10, 150);
  const mx = ax+dx*26, my = ay+dy*26;
  for (let i=0;i<(big?18:11);i++) {
    const f = document.createElement("span"); f.className = "flame"; f.textContent = "🔥"; world.appendChild(f);
    const len = reach*(.5+.5*Math.random()), j = (Math.random()-.5)*(big?50:34);
    const ex = mx+dx*len-dy*j, ey = my+dy*len+dx*j;
    f.animate([{transform:`translate(${mx}px,${my}px) translate(-50%,-50%) scale(.3)`, opacity:1},
               {transform:`translate(${ex}px,${ey}px) translate(-50%,-50%) scale(${1.1+Math.random()*.9})`, opacity:0}],
              {duration:600+Math.random()*300, delay:i*35, easing:"ease-out", fill:"backwards"}).onfinish = () => f.remove();
  }
  if (Math.random() < .35 || big) {
    const t = document.createElement("span"); t.className = "roar"; t.textContent = pick(["ROAR!","GRRR!","ROOAAR!"]); world.appendChild(t);
    t.animate([{transform:`translate(${ax}px,${ay-30}px) translate(-50%,-50%) scale(.6)`, opacity:0},{transform:`translate(${ax}px,${ay-50}px) translate(-50%,-50%) scale(1.15)`, opacity:1, offset:.3},
               {transform:`translate(${ax}px,${ay-70}px) translate(-50%,-50%) scale(1)`, opacity:0}], {duration:1100}).onfinish = () => t.remove();

const BOT_NAMES = ["Aisyah","Rafi","Fikri","Nadia","Budi","Salsa","Dimas","Putri","Arya","Zahra","Ilham","Nabila"];
const dragonPos = (t, m) => { const f = Math.max(0, t)/m.duration; return m.track*(-0.06 + 0.55*f + 0.25*f*f); };
const raceBase = m => 0.35*m.track/m.duration;          // jogging speed (m/s) — everyone keeps moving slowly
const sortStand = list => list.slice().sort((a,b) => (b.fin-a.fin) || (a.fin ? a.ft-b.ft : 0) || (b.p-a.p));

function botState(i, m, nowMs){                          // demo robots: deterministic, so every tab sees the same race
  const R = seeded(m.seed + i*17), skill = .45 + R()*.5, every = Math.round(12 + R()*16), base = raceBase(m), T = m.track;
  const t = m.startAt ? Math.min(m.duration, Math.max(0, (nowMs - m.startAt)/1000)) : 0;
  let p=0, pts=0, b=0, fin=0, ft=0, cor=0, tot=0;
  for (let s=1; s<=t; s++) {
    p += base;
    if (s % every === 0) { tot++; if (R() < skill) { cor++; p += .05*T; pts += 110 + Math.round(R()*60); } }
    const D = dragonPos(s, m); if (p <= D) { p = D + .03*T; b++; pts = Math.max(0, pts-50); }
    if (p >= T) { fin=1; ft=s; p=T; pts += 300; break; }
  }
  return {cls:m.cls==="ALL" ? "XI-1" : m.cls, name:"🤖 "+BOT_NAMES[i], p, pts, fin, ft, cor, tot, b, str:0, t:nowMs};
}
const MockRace = {
  get(){ return store.get("dr_demo_race") || memRace.m; }, set(m){ memRace.m = m; store.set("dr_demo_race", m); },
  ps(){ return store.get("dr_demo_race_ps") || memRace.ps || {}; }, setPs(p){ memRace.ps = p; store.set("dr_demo_race_ps", p); },
  players(m){ const now = Date.now(); return BOT_NAMES.slice(0, m.bots||0).map((_,i)=>botState(i,m,now)).concat(Object.values(this.ps())); },
  exec(a, d){
    const now = Date.now(); let m = this.get();
    const teacherOk = () => String(d.tpin||"") === "1234";
    if (a==="raceCreate") {

    if (!m) return {ok:false, error:"There is no race."};
    if (a==="raceStart") { if (!teacherOk()) return {ok:false, error:"Wrong teacher PIN."}; m.state="running"; m.startAt=now+6000; this.set(m); return {ok:true, race:m, now}; }
    if (a==="raceEnd") { if (!teacherOk()) return {ok:false, error:"Wrong teacher PIN."}; m.state="ended"; this.set(m); return {ok:true, race:m, players:sortStand(this.players(m)), now}; }

      this.setPs(ps); return {ok:true, race:m, players:this.players(m), now};
    }
    return {ok:false, error:"Unknown action"};
  }
};

  $("#back").onclick = () => { clearInterval(S.racePoll); renderMap(); };
  if ($("#demoRace")) $("#demoRace").onclick = () => {
    const land = Math.max(1, ...LEVELS.filter(L => !L.story && isUnlocked(L.id)).map(L=>L.id));
    MockRace.exec("raceCreate", {tpin:"1234", cls:S.auth.cls, land, duration:180});
    MockRace.exec("raceStart", {tpin:"1234"});
  };
  let joinedId = null;
  const poll = async () => {
    try {
      const t0 = Date.now(), out = await api("raceState", {cls:S.auth.cls}), t1 = Date.now();
      if (!out.ok) throw new Error(out.error);
      const m = out.race, box = $("#lobby"); if (!box) return;
      if (!m || m.state==="ended") { box.innerHTML = `<h2 class="title">No race yet</h2><p>When your teacher opens a race, you will join it here automatically. Keep this page open.</p><div class="spinner"></div>`; return; }
      if (joinedId !== m.id) { const j = await api("raceJoin", {...S.auth, raceId:m.id}); if (!j.ok) throw new Error(j.error); joinedId = m.id; }
      const L = LEVELS.find(x=>x.id===m.land) || LEVELS[0];
      if (m.state==="running") { clearInterval(S.racePoll); requestFS(); startRace(m, out.now - (t0+t1)/2, out.players); return; }
      box.innerHTML = `<h2 class="title">You're in! 🎉</h2><p style="margin:0">${L.icon} <b>${esc(L.name)}</b> · ${esc(L.topic)} · ${fmtT(m.duration)} min</p>

    } catch(e) { const box=$("#lobby"); if (box) box.innerHTML = `<p>Connection problem — retrying…</p><div class="spinner"></div>`; }
  };
  poll(); S.racePoll = setInterval(poll, 2000);
}

/* ---------- student: the race ---------- */
function landGens(L){ return (L.mix || L.story) ? LEVELS.filter(x=>!x.mix && !x.story).flatMap(x=>x.gens) : L.gens; }
function makeQ(gens, kind, used){
  for (let k=0;k<400;k++) {
    const sl = pick(gens)();
    if (used.has(sl.key)) continue;
    if (k<250 && S.seen.has(sl.key)) continue;
    const it = toKind(sl, k<300 ? kind : "choose"); if (!it) continue;
    used.add(sl.key); return it;
  }
  return toKind(pick(gens)(), "choose");
}
function raceMore(r){ ["Q","Q","F","Q","Q","F"].forEach(x => r.steps.push(makeQ(r.gens, x==="F" ? "fire" : pick(["choose","choose","build","spot"]), r.used))); }
const raceS = p => S.run.Ls*(0.03 + 0.94*Math.min(p, S.run.T)/S.run.T);

function startRace(meta, offset, players){
  const L = LEVELS.find(x=>x.id===meta.land) || LEVELS[0];
  S.run = { race:true, meta, L, T:meta.track, base:raceBase(meta), offset, gens:landGens(L), used:new Set(), steps:[], i:0,
            points:0, correct:0, streak:0, bonusSum:0, strikes:0, log:[], results:[], pos:0, boost:0, stunUntil:0, fin:0, ft:0, burns:0,
            others:(players||[]).filter(p => p.cls+"|"+p.name !== meKey()), answered:true, last:Date.now(), startedAt:Date.now(), finished:false,
            nextBreath:Date.now()+4000, lastPush:0, started:false, gap:100 };
  raceMore(S.run);
  renderStage();
  $("#sheet").innerHTML = `<div class="center"><h2 class="title" style="margin:4px 0">Get ready!</h2><p class="small muted">Answer correctly to sprint. The dragon chases everyone!</p></div>`;
  armAntiCheat();
  clearInterval(S.tick); S.tick = setInterval(raceTick, 150);
}
function raceNow(){ return Date.now() + S.run.offset; }
function raceTick(){
  const r = S.run; if (!r || !r.race || r.finished) return;
  const el = (raceNow() - r.meta.startAt)/1000, now = Date.now(), dt = Math.min(.5, (now - r.last)/1000); r.last = now;
  const cd = $("#cd");
  if (el < 0) { if (cd) { cd.style.display = "flex"; cd.textContent = Math.ceil(-el) <= 3 ? Math.ceil(-el) : "Ready…"; } return; }
  if (!r.started) { r.started = true; r.startedAt = now; if (cd) { cd.textContent = "GO!"; setTimeout(() => { const c=$("#cd"); if (c) c.style.display="none"; }, 700); } renderStep(); }
  if (el >= r.meta.duration) { raceOver("time"); return; }
  const D = dragonPos(el, r.meta);
  if (!r.fin) {
    if (now >= r.stunUntil) {
      r.pos += r.base*dt;
      const add = Math.min(r.boost, r.T*0.06*dt); r.pos += add; r.boost -= add;
      if (r.pos <= D) {                                    // the dragon caught up
        r.burns++; r.points = Math.max(0, r.points-50); r.pos = D + 0.03*r.T; r.stunUntil = now + 2500; r.streak = 0;
        breathe(true); setTimeout(() => scare(true, "🥵"), 150); refreshHUD(); toast("🔥 Burned by the dragon! −50 points");
      }
    }
    if (r.pos >= r.T) { r.pos = r.T; r.fin = 1; r.ft = Math.round(el*10)/10; r.points += 300; refreshHUD(); racePush();
      $("#sheet").innerHTML = `<div class="center"><div class="big">🏁</div><h2 class="title" style="margin:0">You finished!</h2><p class="small muted">+300 points · watch the others race…</p></div>`; }
  }
  r.gap = (r.pos - D)/r.T*100*2.5;                          // for the danger glow
  if (!r.fin && now >= r.nextBreath) { const close = r.pos - D < .08*r.T; if (D > -10) breathe(false); r.nextBreath = now + (close ? 1700 : 3000) + Math.random()*2000; }
  if (now - r.lastPush >= CONFIG.RACE_POLL_MS) racePush();
  const st = r.steps[r.i];
  if (st && st.t==="fire" && !r.answered && r.started) {
    const left = r.fireEnd - now, b = $("#cbar");
    if (b) b.style.width = Math.max(0, left/(r.L.fire*10))+"%";
    if (left <= 0) judge(null);
  }
}
async function racePush(){
  const r = S.run; if (!r || !r.race) return;
  r.lastPush = Date.now();
  try {
    const t0 = Date.now();
    const out = await api("raceUpdate", {...S.auth, raceId:r.meta.id, p:Math.round(r.pos*10)/10, pts:r.points, fin:r.fin, ft:r.ft, cor:r.correct, tot:r.results.length, b:r.burns, str:r.strikes});
    if (!out.ok || S.run !== r) return;
    r.offset = r.offset*.7 + (out.now - (t0+Date.now())/2)*.3;
    r.others = out.players.filter(p => p.cls+"|"+p.name !== meKey());
    if (out.race && out.race.state==="ended" && !r.over) raceOver("ended");
  } catch(e) {}
}
function standingsNow(){
  const r = S.run, nowS = raceNow(), list = r.others.map(o => {
    const extra = o.fin ? 0 : Math.min(r.base*6, r.base*Math.max(0, (nowS - (o.t||nowS))/1000));
    return {...o, p:Math.min(r.T, (o.p||0) + extra)};
  });
  list.push({cls:S.auth.cls, name:S.auth.name, p:r.pos, pts:r.points, fin:r.fin, ft:r.ft, me:1, str:r.strikes});
  return sortStand(list);
}
function frameRace(now){
  const r = S.run, stage = $("#stage"); if (!r || !stage || r.finished) return;
  const W = stage.clientWidth, H = stage.clientHeight, sc = W/MW, world = $("#world");
  world.style.width = W+"px"; world.style.height = MH*sc+"px";
  const dt = Math.min(.05, (now-(r.lf||now))/1000); r.lf = now;
  const el = (raceNow() - r.meta.startAt)/1000, D = dragonPos(Math.max(0, el), r.meta);
  r.rS += (raceS(r.pos) - r.rS)*Math.min(1, dt*6);
  r.dS += (raceS(Math.max(0, D)) - r.dS)*Math.min(1, dt*4);
  const rp=P(r.rS), dp=P(r.dS), ra=P(r.rS+6), da=P(r.dS+6);
  placeTok($("#run"), rp, sc, ra.x >= rp.x ? -1 : 1);
  placeTok($("#drg"), dp, sc, da.x >= dp.x ? -1 : 1);
  $("#drg").style.opacity = D < -2 ? .35 : 1;
  const stand = standingsNow(), gl = $("#ghosts");
  stand.forEach(o => {
    if (o.me) return;
    const id = "g_"+btoa(unescape(encodeURIComponent(o.cls+"|"+o.name))).replace(/[^a-z0-9]/gi,"");
    let g = document.getElementById(id);
    if (!g) { g = document.createElement("div"); g.id = id; g.className = "tok ghost"; g.innerHTML = `<span class="in">${o.fin?"🏁":"🏃"}</span><span class="nm">${esc(o.name.replace("🤖 ",""))}</span>`; gl.appendChild(g); }
    o.s = o.s==null ? raceS(o.p) : o.s;
    const s = raceS(o.p), q = P(s), qa = P(s+6);
    placeTok(g, q, sc, qa.x >= q.x ? -1 : 1);
  });
  const target = rp.y*sc - H*0.27;
  r.cam = r.cam==null ? target : r.cam + (target - r.cam)*Math.min(1, dt*4);
  world.style.transform = `translateY(${-r.cam}px)`;
  if (stage.scrollTop) stage.scrollTop = 0;
  const myRank = stand.findIndex(o=>o.me)+1;
  $("#rtime").textContent = el < 0 ? fmtT(r.meta.duration) : fmtT(r.meta.duration - el);
  $("#rrank").textContent = `#${myRank}/${stand.length}`;
  $("#rdist").textContent = `${Math.floor(r.pos)} / ${r.T} m`;
  $("#rdrag").textContent = r.fin ? "🏁" : `🐉 ${Math.max(0, Math.floor(r.pos - D))} m`;
  $("#rtop").innerHTML = stand.slice(0,3).map((o,k)=>`<span class="${o.me?"me":""}">${["🥇","🥈","🥉"][k]} ${esc(o.me?"You":o.name.replace("🤖 ",""))} ${Math.floor(o.p)}m</span>`).join("") + (myRank>3 ? `<span class="me">#${myRank} You ${Math.floor(r.pos)}m</span>` : "");
  stage.classList.toggle("close", !r.fin && r.pos - D < .06*r.T && el > 0);
  r.raf = requestAnimationFrame(frameRace);
}
function raceOver(why){
  const r = S.run; if (!r || r.over) return;
  r.over = true; r.finished = true;
  clearInterval(S.tick); cancelAnimationFrame(r.raf); disarmAntiCheat(); exitFS(); hideOverlay();
  document.body.classList.remove("running");
  racePushFinal(r);
  const stand = standingsNow(), me = stand.findIndex(o=>o.me)+1;
  app.innerHTML = `
    <div class="hero" style="margin:14px 0 8px">${me===1?"🏆":me<=3?"🎉":"🏁"}</div>
    <div class="parch center"><div class="qtype">Class race · ${esc(r.L.name)}</div>
      <h2 class="title" style="margin:6px 0">${why==="out" ? "You're out (3 strikes)" : me===1 ? "You won the race!" : `You finished #${me} of ${stand.length}`}</h2>
      <p style="margin:4px 0">${Math.floor(r.pos)} m · ${r.points} points · ${r.correct}/${r.results.length} correct · 🔥 burned ${r.burns}×</p>
      <p class="small" style="margin:6px 0 0">The final results are on your teacher's screen.</p></div>
    <div class="card" style="margin-top:14px;padding:6px 10px"><table><tr><th>#</th><th>Runner</th><th>Distance</th><th style="text-align:right">Points</th></tr>
      ${stand.map((o,k)=>`<tr class="${o.me?"me":""}"><td>${k<3?["🥇","🥈","🥉"][k]:k+1}</td><td>${esc(o.me?S.auth.name:o.name)}${o.str>=CONFIG.MAX_STRIKES?" 🚫":""}</td><td>${o.fin?"🏁 "+fmtT(o.ft):Math.floor(o.p)+" m"}</td><td style="text-align:right">${o.pts}</td></tr>`).join("")}
    </table></div>
    <button class="btn block" id="map" style="margin-top:16px">Back to the map</button>`;
  $("#map").onclick = renderMap;
}
async function racePushFinal(r){ try { await api("raceUpdate", {...S.auth, raceId:r.meta.id, p:Math.round(r.pos*10)/10, pts:r.points, fin:r.fin, ft:r.ft, cor:r.correct, tot:r.results.length, b:r.burns, str:r.strikes}); } catch(e) {} }

/* ---------- endings ---------- */
function resultOf(r, status){
  const total = r.steps.length;
  return { caseId:r.caseId, attempt:r.attempt, status, points:Math.max(0, Math.round(r.points)), correct:r.correct, total,
           speed:Math.round(r.bonusSum/(50*PATTERN.filter(x=>x==="Q").length)*100), strikes:r.strikes,
           accused:"", log:JSON.stringify(r.log), qids:r.qids.join(",") };
}
function caught(){
  const r=S.run; if (!r||r.finished||r.ending) return;
  r.ending = true; r.gap = 0; r.dS = r.rS;
  breathe(true); setTimeout(() => scare(true, "😵"), 200);
  const sh=$("#sheet"); if (sh) sh.innerHTML = `<div class="center"><div class="big">🐉🔥</div><h2 class="title" style="margin:0">The dragon caught you!</h2></div>`;
  setTimeout(() => finishRun("caught"), 1600);
}
function treasure(){
  const r=S.run; if (!r||r.finished||r.ending) return;
  r.ending = true; r.rT = r.Ls*0.985;
  const bonus = 200 + Math.round(r.gap*3) + (r.L.final ? 500 : 0);
  r.points += bonus; r.treasureBonus = bonus; refreshHUD();
  setTimeout(() => scare(false, "🤩"), 700);
  const sh=$("#sheet"); if (sh) sh.innerHTML = `<div class="center"><div class="big">${r.L.final?"👑":"💰"}</div><h2 class="title" style="margin:0">You reached the treasure!</h2><p class="small muted">+${bonus} treasure bonus</p></div>`;
  setTimeout(() => finishRun("completed"), 1800);
}
async function finishRun(status){
  const r=S.run; if (!r||r.finished) return;
  r.finished = true;
  clearInterval(S.tick); cancelAnimationFrame(r.raf); disarmAntiCheat(); exitFS(); hideOverlay();
  document.body.classList.remove("running");
  const res = resultOf(r, status);
  app.innerHTML = `<div class="spinner"></div><p class="center muted">Saving your run…</p>`;
  await submitResult(res, r);
}
async function submitResult(res, r){
  try {
    const out = await api("submit", {...S.auth, ...res});
    if (!out.ok) throw new Error(out.error||"Save failed");
    S.progress = out.progress; store.set("dr_pending", null);
    renderResult(res, r, true);
  } catch(e) {
    store.set("dr_pending", {user:S.auth.cls+"|"+S.auth.name, res});
    renderResult(res, r, false, e.message);
  }
}
function renderResult(res, r, saved, err){
  const L = r.L, acc = res.total ? Math.round(res.correct/res.total*100) : 0;
  const won = res.status==="completed";
  const head = won ? (L.final ? "👑🐉" : "💰🏃") : res.status==="caught" ? "🐉🔥" : "🚫";
  const msg = won ? `You escaped and found the treasure: <b>${L.loot[0]} ${esc(L.loot[1])}</b>! Treasure bonus +${r.treasureBonus}.`
    : res.status==="caught" ? "The dragon caught you! Obstacles you didn't reach count as wrong."
    : "Your run ended automatically after 3 strikes. Your teacher can see when you left the game.";
  app.innerHTML = `
    <div class="hero" style="margin:14px 0 8px">${head}</div>
    <div class="parch center"><div class="qtype">Land ${L.id} · ${esc(L.name)}</div>
      <div class="st" style="font-size:40px;color:#c08a14">${starStr(starsFor(acc))}</div>
      <h2 class="title">${res.points} points</h2>
      <p style="margin:6px 0">Accuracy <b>${acc}%</b> (${res.correct}/${res.total}) · Strikes <b>${res.strikes}</b></p>
      <p style="margin:6px 0 0">${msg}</p></div>
    ${won && L.final ? `<div class="parch" style="margin-top:14px"><h2 class="title">The End… or a new beginning</h2><p style="line-height:1.6;margin:0">${esc(ENDING)}</p></div>` : ""}
    ${r.practice ? `<div class="hintbox" style="margin-top:14px">🔁 Practice run — it does not change your grade. Play again for new questions!</div>` : ""}
    ${!won && res.status==="caught" && !r.practice ? `<div class="card small" style="margin-top:14px">💡 Tip: you still have ${Math.max(0,CONFIG.MAX_ATTEMPTS-((S.progress[L.id]||{}).attempts||0))} tries left (then unlimited practice). You will get new questions next time. The next land is open, but this land's treasure is only yours when you reach the end.</div>`:""}
    ${saved ? "" : `<div class="feedback no">⚠️ Not saved yet (${esc(err||"network error")}). Check your connection and tap Retry — it will also retry the next time you log in.
        <button class="btn block" id="retry" style="margin-top:10px">Retry saving</button></div>`}
    <div class="row" style="margin-top:16px"><button class="btn" id="map">Back to the map</button><button class="btn ghost" id="lbBtn">🏆 Leaderboard</button></div>`;
  $("#map").onclick = renderMap; $("#lbBtn").onclick = renderLeaderboard;
  if (!saved) $("#retry").onclick = () => { app.innerHTML=`<div class="spinner"></div>`; submitResult(res, r); };
}

/* =====================================================================
   ANTI-CHEAT
   ===================================================================== */
const AC = { armed:false, last:0, area:0 };
function onVis(){ if (document.visibilityState==="hidden") strike("You left the game (switched tab or app)"); }
function onBlur(){ strike("The game window lost focus (another window or app)"); }
function onResize(){ const a=innerWidth*innerHeight; if (a>AC.area) { AC.area=a; return; } if (a<AC.area*0.6) { AC.area=a; strike("The screen became much smaller (split-screen or small window)"); } }
function blockEvt(e){ e.preventDefault(); }
function onPageHide(){
  const r=S.run; if (!r||r.finished) return;
  if (r.race) { r.finished = true; r.log.push({t:"end", reason:"Closed the game during the race"});
    const d = {action:"raceUpdate", ...S.auth, raceId:r.meta.id, p:Math.round(r.pos*10)/10, pts:r.points, fin:r.fin, ft:r.ft, cor:r.correct, tot:r.results.length, b:r.burns, str:r.strikes};
    if (!CONFIG.API_URL) MockRace.exec("raceUpdate", d); else try { navigator.sendBeacon(CONFIG.API_URL, new Blob([JSON.stringify(d)], {type:"text/plain;charset=utf-8"})); } catch(e) {}
    return; }
  r.finished = true; r.abandoned = true; cancelAnimationFrame(r.raf);
  r.log.push({t:"end", reason:"Closed or left the game during the run"});
  const res = {action:"submit", ...S.auth, ...resultOf(r, "abandoned")};
  if (!CONFIG.API_URL) { Mock.exec("submit", res); return; }
  try { navigator.sendBeacon(CONFIG.API_URL, new Blob([JSON.stringify(res)], {type:"text/plain;charset=utf-8"})); } catch(e) {}
}
function armAntiCheat(){
  AC.armed=true; AC.last=Date.now(); AC.area=innerWidth*innerHeight;
  document.addEventListener("visibilitychange", onVis); window.addEventListener("blur", onBlur);
  window.addEventListener("resize", onResize); window.addEventListener("pagehide", onPageHide);
  ["copy","cut","paste","contextmenu"].forEach(ev => document.addEventListener(ev, blockEvt));
}
function disarmAntiCheat(){
  AC.armed=false;
  document.removeEventListener("visibilitychange", onVis); window.removeEventListener("blur", onBlur);
  window.removeEventListener("resize", onResize); window.removeEventListener("pagehide", onPageHide);
  ["copy","cut","paste","contextmenu"].forEach(ev => document.removeEventListener(ev, blockEvt));
}
function strike(reason){
  const r=S.run; if (!AC.armed||!r||r.finished) return;
  const now=Date.now(); if (now-AC.last<2500) return;   // one event = one strike
  AC.last=now; r.strikes++;
  r.log.push({t:Math.round((now-r.startedAt)/1000)+"s", reason});
  if (r.strikes >= CONFIG.MAX_STRIKES) { if (r.race) raceOver("out"); else finishRun("auto-submitted"); return; }
  let pen = "";
  if (r.strikes===2) { r.points=Math.max(0, r.points-CONFIG.STRIKE_PENALTY); pen=`<b>−${CONFIG.STRIKE_PENALTY} points.</b> `; }
  refreshHUD();
  showOverlay(`<div class="big">🚨</div><h2 class="title">Strike ${r.strikes} of ${CONFIG.MAX_STRIKES}</h2>
    <p>${esc(reason)}.</p><p>${pen}The dragon is still running!</p>
    <p class="small muted">${r.strikes===1 ? `Next strike: −${CONFIG.STRIKE_PENALTY} points.` : "Next strike: your run ends automatically."}</p>
    <button class="btn block" id="resume">Back to the run</button>`);
  $("#resume").onclick = () => { hideOverlay(); requestFS(); };
}
window.addEventListener("pageshow", e => {
  if (e.persisted && S.run && S.run.abandoned) {
    hideOverlay(); document.body.classList.remove("running");
    app.innerHTML = `<div class="parch center"><h2 class="title">Run ended</h2><p>You left the game during the run, so this try was saved with the points you had.</p></div>
      <button class="btn block" id="relog" style="margin-top:14px">Log in again</button>`;
    $("#relog").onclick = () => { S.run=null; renderLogin(); };
  }
});

/* =====================================================================
   TREASURE BAG & LEADERBOARD
   ===================================================================== */
function renderBag(){
  stopLB();
  app.innerHTML = `
    <div class="topbar"><button class="btn ghost sm" id="back">← Map</button><span class="pill gold">${Object.values(S.progress).filter(c=>c.won).length}/${LEVELS.length}</span></div>
    <h2 class="title">🎒 Treasure Bag</h2><p class="small muted">Reach the end of a land without being caught to collect its treasure.</p>
    <div class="bag">${LEVELS.map(L => { const has=(S.progress[L.id]||{}).won;
      return `<div class="it ${has?"":"no"}"><div class="e">${L.loot[0]}</div><b>${esc(L.loot[1])}</b><div class="small">${esc(L.name)}</div></div>`; }).join("")}</div>
    ${foot()}`;
  $("#back").onclick = renderMap;
}
function lbTable(rows){
  if (!rows.length) return `<p class="muted center">No scores yet. Be the first runner!</p>`;
  return `<div class="card" style="padding:6px 10px"><table>
    <tr><th>#</th><th>Runner</th><th>Class</th><th>Lands</th><th style="text-align:right">Points</th></tr>
    ${rows.map((r,i)=>{ const me = S.auth && r.name===S.auth.name && r.cls===S.auth.cls;
      return `<tr class="${me?"me":""}"><td>${i<3?["🥇","🥈","🥉"][i]:i+1}</td><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td>${r.cases}/${LEVELS.length}</td><td style="text-align:right;font-weight:700">${r.points}</td></tr>`; }).join("")}
  </table></div><p class="small muted center">Updated ${new Date().toLocaleTimeString()} · refreshes automatically</p>`;
}
async function loadLB(n){
  if (!$("#lb")) return;
  try { const out = await api("leaderboard", {cls:S.lbFilter}); if (!out.ok) throw new Error(out.error); if ($("#lb")) $("#lb").innerHTML = lbTable(out.rows.slice(0,n)); }
  catch(e) { if ($("#lb")) $("#lb").innerHTML = `<p class="muted center">Cannot load the leaderboard right now. Retrying…</p>`; }
}
function renderLeaderboard(){
  stopLB();
  app.innerHTML = `
    <div class="topbar"><button class="btn ghost sm" id="back">← Map</button><span class="pill gold">● Live</span></div>
    <h2 class="title">🏆 Leaderboard</h2>
    <div class="row" style="margin-bottom:12px"><button class="btn ${S.lbFilter?"ghost":""}" id="fAll">All classes</button><button class="btn ${S.lbFilter?"":"ghost"}" id="fMine">My class (${esc(S.auth.cls)})</button></div>
    <div id="lb"><div class="spinner"></div></div>`;
  $("#back").onclick = renderMap;
  $("#fAll").onclick = () => { S.lbFilter=""; renderLeaderboard(); };
  $("#fMine").onclick = () => { S.lbFilter=S.auth.cls; renderLeaderboard(); };
  loadLB(30); S.lbTimer = setInterval(()=>loadLB(30), CONFIG.LEADERBOARD_REFRESH_MS);
}
async function renderBoard(){
  document.body.classList.add("board-mode");
  S.lbFilter = new URLSearchParams(location.search).get("class") || "";
  app.innerHTML = `<div class="logo">🐉 Dragon Run · Live Leaderboard</div>
    <div class="row" style="justify-content:center;margin:10px 0 16px"><select id="bcls" style="max-width:280px"><option value="">All classes</option></select></div>
    <div id="lb"><div class="spinner"></div></div>`;
  try { const out = await api("roster"); if (out.ok) { const cl=[...new Set(out.students.map(s=>s.cls))].sort(); $("#bcls").innerHTML += cl.map(c=>`<option ${c===S.lbFilter?"selected":""}>${esc(c)}</option>`).join(""); } } catch(e) {}
  $("#bcls").onchange = e => { S.lbFilter=e.target.value; loadLB(15); };
  loadLB(15); S.lbTimer = setInterval(()=>loadLB(15), 10000);
}

/* =====================================================================
   START
   ===================================================================== */
const QS = new URLSearchParams(location.search);
if (QS.has("host")) renderHost(); else if (QS.has("board")) renderBoard(); else renderLogin();
</script>
